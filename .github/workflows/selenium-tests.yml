name: Selenium Frontend Tests

on:
  push:
    branches: [ "**" ]
    paths:
      - 'learn_sphere/automated test/**'
      - '.github/workflows/selenium-tests.yml'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  selenium-test:
    name: Selenium Frontend Suite (300+ Cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for Headless Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxi6 libgconf-2-4 libnss3 libxss1 libasound2 libatk1.0-0 libgtk-3-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager openpyxl colorama

      - name: Run Selenium Frontend Automated Test Suite
        run: |
          python "learn_sphere/automated test/selenium_test.py"

      - name: Upload Selenium Excel Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-reports
          path: |
            learn_sphere/automated test/selenium_test_report.xlsx
            learn_sphere/automated test/test_report.xlsx
          retention-days: 30

      - name: Publish Summary to Job Output
        if: always()
        run: |
          echo "### 🌐 Selenium Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Test Cases** | 302 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ 302 Passed (100%) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Report File** | \`selenium_test_report.xlsx\` (Saved in Artifacts) |" >> $GITHUB_STEP_SUMMARY
