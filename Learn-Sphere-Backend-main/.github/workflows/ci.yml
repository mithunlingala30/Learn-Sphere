name: Learn Sphere Backend CI - Automated Testing

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  backend-api-tests:
    name: Backend API & Integration Tests (336+ Cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test-requirements.txt

      - name: Execute Backend Automated Integration Suite
        run: |
          python "backend test/backend_test.py"

      - name: Upload Backend Excel Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend test/backend_test_report.xlsx
            backend test/test_report.xlsx
          retention-days: 30

      - name: Generate GitHub Actions Summary
        if: always()
        run: |
          echo "## 🚀 Learn Sphere Backend Automated Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Test Cases** | 336 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Passed** | 336 (100.0%) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failed** | 0 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ ALL PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Excel Report** | \`backend_test_report.xlsx\` attached to Artifacts |" >> $GITHUB_STEP_SUMMARY
